<!DOCTYPE html>
<html>
<head>
    <title>Stop Form - CampusRide</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
        }

        .header {
            background: #173b57;
            color: white;
            padding: 20px;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px;
            box-sizing: border-box;
        }

        button {
            background: #173b57;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: #173b57;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>CampusRide</h1>
    <p>Stop Management</p>
</div>

<div class="container">

    {% if stop %}
        <h2>Edit Stop</h2>
    {% else %}
        <h2>Add Stop</h2>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Stop Name</label>

        <input
            type="text"
            name="stop_name"
            value="{{ stop.stop_name|default:'' }}"
            placeholder="Example: New Bus Stand"
            required
        >

        <label>Location</label>

        <input
            type="text"
            name="location"
            value="{{ stop.location|default:'' }}"
            placeholder="Example: Kovilpatti"
            required
        >

        <button type="submit">

            {% if stop %}
                Update Stop
            {% else %}
                Add Stop
            {% endif %}

        </button>

    </form>

    <br>

    <a href="{% url 'stop_list' %}">
        ← Back to Stop List
    </a>

</div>

</body>
</html>
