<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #193f5b;
            color: white;
            padding: 40px 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
        }

        .header p {
            margin-top: 25px;
            font-size: 18px;
        }

        .container {
            padding: 50px 34px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 400px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .login-btn {
            background-color: #193f5b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #122f45;
        }

        .error {
            color: #d9534f;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .register-link {
            display: inline-block;
            margin-top: 20px;
            color: #193f5b;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>CampusRide</h1>
        <p>Student Login</p>
    </div>

    <div class="container">

        <h2>Student Login</h2>

        <div class="login-box">

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <a href="{% url 'student_create' %}" class="register-link">
                New student? Register here
            </a>

        </div>

    </div>

</body>
</html>
