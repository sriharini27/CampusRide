{% extends 'transport/base.html' %}
{% load static %}

{% block title %}500 Server Error - CampusRide{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="stat-icon warning mx-auto mb-3 fs-1 p-4 rounded-circle" style="width: 80px; height: 80px;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-warning mb-2">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted max-w-500 mx-auto mb-4">Something went wrong on our end. Please try refreshing or return to the main dashboard.</p>
        <a href="{% url 'landing_page' %}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door me-1"></i> Return to CampusRide Home
        </a>
    </div>
</div>
{% endblock %}
