<!DOCTYPE html>
<html>
<head>
    <title>Stop Management - CampusRide</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #173b57;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 30px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px #ccc;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b57;
            color: white;
        }

        a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            background: #173b57;
        }

        .add {
            display: inline-block;
            margin-bottom: 20px;
        }

        .delete {
            background: #c0392b;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>CampusRide</h1>
    <p>Stop Management</p>
</div>

<div class="container">

    <h2>Stop Management</h2>

    <a href="{% url 'stop_create' %}" class="add">
        + Add Stop
    </a>

    <table>

        <tr>
            <th>Stop Name</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>

        {% for stop in stops %}

        <tr>
            <td>{{ stop.stop_name }}</td>

            <td>{{ stop.location }}</td>

            <td>
                <a href="{% url 'stop_update' stop.id %}">
                    Edit
                </a>

                <a href="{% url 'stop_delete' stop.id %}"
                   class="delete">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="3">
                No stops available.
            </td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
